name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ankane/pgvector
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: fxmeta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fxmeta"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:devpassword@localhost:5432/fxmeta
      AI_SERVICE_BASE_URL: http://localhost:8001
      AI_SERVICE_MOCK_MODE: "true"
      CORS_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q app migrations
      - name: Apply migrations on an empty database
        run: alembic upgrade head
      - name: Import FastAPI application
        run: python -c "from app.main import app; assert app.routes"
